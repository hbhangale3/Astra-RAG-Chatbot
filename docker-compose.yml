services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra-backend
    env_file:
      - .env.docker
    environment:
      MODE: backend
      PYTHONPATH: /app
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-llama-3.3-70b-versatile}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.2}
      CREWAI_TRACING_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: ["bash", "run_astra.sh"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra-frontend
    env_file:
      - .env.docker
    environment:
      MODE: frontend
      PYTHONPATH: /app
      BACKEND_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    command: ["bash", "run_astra.sh"]

  prometheus:
    image: prom/prometheus:latest
    container_name: astra-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: astra-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  grafana_data:
