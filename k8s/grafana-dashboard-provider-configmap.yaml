apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: astra-rag
data:
  dashboard-provider.yaml: |
    apiVersion: 1

    providers:
      - name: astra-rag-dashboards
        orgId: 1
        folder: AstraRAG
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
