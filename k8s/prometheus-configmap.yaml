apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: astra-rag
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: "astra-backend"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["astra-backend-service:8000"]
